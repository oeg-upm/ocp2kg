    s:
      http://epo-changes.org/$(reference_version)-$(target_version)/AddDataProperty/$(added_attributes)
    po:
    - [rdf:type, och:AddDataProperty]
    #- [rdfs:comment, $(comment)]
    - [och:addedDataProperty, $(added_attributes_full)~iri]

  AddedAttributesDomain:
    sources:
    - [Parsed_Changes/modified_attributes_3.0.1.csv~csv]
    s:
      http://epo-changes.org/$(reference_version)-$(target_version)/AddDomain/$(added_attributes)
    po:
    - [rdf:type, och:AddDomain]
    #- [rdfs:comment, $(comment)]
    - [och:addedDomain, $(class_full)~iri]
